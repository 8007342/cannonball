schema: spec-driven
context: |
  Cannonball is a landscape arcade pseudo-3D road trip racer, Flutter + Flame,
  inspired by OutRun and New York to Redondo Beach Cannonball lore.
  Web only, mobile browsers first at cannonball.tlatoani.net; optional PWA install.
  Desktop browsers should support higher-resolution asset packs. No native apps.
  City-to-city campaign stages target 10–15 minutes; coast-to-coast progress composes connected stages.
  Cloudflare Pages hosts Flutter; a same-origin Worker handles identity and data.
  Implementation is now authorized under playable-road-trip; production assets and real-device acceptance remain tracked.
  User requirements are captured in openspec/specs; unresolved choices live in
  docs/design/interview.md. Do not silently promote proposals into confirmed decisions.
  Preserve continuous driving, readable speed and advance hazard warnings.
  Car advantages, route distances, traffic and luck remain intentional. New stage rankings are undecided; retain the legacy board until migration is designed. Do not impose equalized competitive modes or car parity.
  Motion/art research is approved; apply diffused pixel edges with coherent animation.
  Original art and music require engine-compatible guides.
rules:
  proposal:
    - Identify user decisions and measurable device/performance acceptance criteria.
  specs:
    - Include WHEN/THEN scenarios for new requirements and failure paths.
  tasks:
    - Include relevant automated checks and real-device validation where browser APIs are involved.

schema: spec-driven
context: |
  Cannonball is a landscape arcade pseudo-3D road trip racer, Flutter + Flame,
  inspired by OutRun and New York to Redondo Beach Cannonball lore.
  Target mobile web first at cannonball.tlatoani.net, with Android/iOS scaffolds.
  Cloudflare Pages hosts Flutter; a same-origin Worker handles identity and data.
  The current scope is foundation, research and design discovery, not a finished game.
  User requirements are captured in openspec/specs; unresolved choices live in
  docs/design/interview.md. Do not silently promote proposals into confirmed decisions.
  Preserve continuous driving across stages, readable speed, fair warning and
  comparable ranked runs. Original art and music require engine-compatible guides.
rules:
  proposal:
    - Identify user decisions and measurable device/performance acceptance criteria.
  specs:
    - Include WHEN/THEN scenarios for new requirements and failure paths.
  tasks:
    - Include relevant automated checks and real-device validation where browser APIs are involved.

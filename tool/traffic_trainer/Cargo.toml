[package]
name = "cannonball-traffic-trainer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local CPU trainer for Cannonball's racer lane-change classifier (assets/traffic/racer-policy.json)."

[dependencies]
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
